# NusaDB Studio — the desktop client, built and released on its own so its GPU and windowing
# dependencies stay out of the engine's build.
[workspace]

[package]
name = "nusadb-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
description = "NusaDB Studio — native desktop database management GUI (Rust + Slint)"
publish = false

[dependencies]
slint = "1"
# The reference client for the Nusa Wire Protocol, from the engine repository.
nusadb-libnusa = { git = "https://github.com/nusadb/nusadb" }
# The driver is async; Studio's event loop is not. A runtime on a worker thread bridges them —
# no macros or timers needed, just somewhere for connection futures to run.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }

[build-dependencies]
slint-build = "1"

[lints.clippy]
unwrap_used = "deny"
