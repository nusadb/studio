# NusaDB Studio is a standalone Cargo workspace, so it carries its own formatting rules rather
# than inheriting them: the repo-root `rustfmt.toml` moved out with the engine, and a lane whose
# gate depends on a config in another repository is a gate that breaks without warning.
#
# Stable-channel options only — the nightly-only import options (`imports_granularity`,
# `group_imports`) would emit a warning on every `cargo fmt` here. Import grouping is kept by
# hand instead: std, then external crates, then `crate::`.
edition = "2024"
max_width = 100
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
match_block_trailing_comma = true
